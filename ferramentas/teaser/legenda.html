<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Legenda do teaser</title>
<link rel="stylesheet" href="../../fontes/fontes.css" />
<style>
  :root { --u: 1vw; --ink: #2b2231; }
  @media (max-aspect-ratio: 1/1) { :root { --u: 1.75vw; } }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .legenda {
    position: absolute; left: 0; right: 0; bottom: 6%;
    margin: 0 auto; width: fit-content;
    max-width: 86%;
    padding: calc(1 * var(--u)) calc(2.8 * var(--u)) calc(1.15 * var(--u));
    background: #fcf2e2;
    border: calc(0.32 * var(--u)) solid var(--ink);
    border-radius: calc(1.8 * var(--u));
    box-shadow: 0 calc(0.5 * var(--u)) 0 var(--ink), 0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0, 0, 0, 0.35);
    font: 600 calc(2.6 * var(--u)) / 1.2 Fredoka, sans-serif;
    color: var(--ink);
    text-align: center;
    text-wrap: balance;
  }
  /* a faixa lilás em cima, como o topo dos crachás */
  .legenda::before {
    content: ""; position: absolute; left: 12%; right: 12%; top: calc(-0.32 * var(--u));
    height: calc(0.6 * var(--u)); border-radius: 0 0 99px 99px; background: #8a63c7;
  }
  .topo .legenda { bottom: auto; top: 13%; }
  /* na faixa embaixo da moldura do jogo */
  .faixa .legenda { bottom: 2.6%; }
  @media (max-aspect-ratio: 1/1) {
    .legenda { bottom: auto; top: 11%; font-size: calc(3.4 * var(--u)); max-width: 90%; }
    .baixo .legenda { top: auto; bottom: 16%; }
    .faixa .legenda { top: auto; bottom: 3.4%; }
  }
</style>
</head>
<body>
  <div class="legenda" id="t"></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('t').textContent = q.get('t') || '';
    if (q.get('pos')) document.body.classList.add(q.get('pos'));
  </script>
</body>
</html>
